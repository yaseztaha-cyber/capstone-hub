<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - STEM Capstone Hub</title>
  <meta name="theme-color" content="#0f766e" />
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9fafb;color:#111827;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{max-width:420px}
    .icon{width:64px;height:64px;background:#f3f4f6;border-radius:9999px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#6b7280;font-size:14px;margin:0 0 24px;line-height:1.5}
    button{background:#0f766e;color:white;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer}
    button:hover{background:#115e59}
    .hint{margin-top:12px;font-size:12px;color:#9ca3af}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are offline</h1>
    <p>It looks like you lost your internet connection. Some features may be unavailable until you are back online.</p>
    <button onclick="window.location.reload()">Retry</button>
    <div class="hint">Check your connection and try again.</div>
  </div>
</body>
</html>
